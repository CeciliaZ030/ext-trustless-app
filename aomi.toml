[app]
# Must equal the `name` in `dyn_aomi_app!` (src/lib.rs); it becomes the release tag.
name         = "trustless-work"
display_name = "Trustless Work · Escrow"
# Private until the live Arc Testnet acceptance run passes.
public       = false
# api.aomi.dev advertises only `prod`; the default ["staging"] would never load there.
server_tags  = ["prod"]
