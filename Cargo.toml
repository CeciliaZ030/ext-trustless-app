[package]
name    = "trustless-work-aomi"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone App: this crate is its own workspace, so Aomi's platform build
# finds Cargo.lock beside it and its deploy gate reads the pin from here.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
aomi-sdk         = "=6.0.0"
alloy-primitives = "1"
alloy-sol-types  = "1"
reqwest          = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
schemars         = "1"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
